<div id="annotation-style-options">
  <div class="viz-carousel viz-dotted-background">
    <section data-variant="Connected leader">
      <div class="sheet" data-design="connected">
        <h2>Theme</h2>
        <div class="systems"></div>
      </div>
    </section>
    <section data-variant="Last-line tail" hidden>
      <div class="sheet" data-design="last">
        <h2>Theme</h2>
        <div class="systems"></div>
      </div>
    </section>
    <section data-variant="Label once" hidden>
      <div class="sheet" data-design="once">
        <h2>Theme</h2>
        <div class="systems"></div>
      </div>
    </section>
  </div>
</div>
<style>
  #annotation-style-options [data-variant] {
    min-height: 440px;
    padding: 16px;
    box-sizing: border-box;
  }
  #annotation-style-options .sheet {
    --sheet-paper: light-dark(#ffffff, #171b23);
    --sheet-ink: light-dark(#0f172a, #e2e8f0);
    --sheet-secondary: light-dark(#475569, #b5c0d0);
    --sheet-rule: light-dark(#94a3b8, #8290a3);
    --sheet-grid: light-dark(#d6dfeb, #354152);
    --sheet-roll: light-dark(#e2e8f0, #252f3e);
    --sheet-blue: light-dark(#2563eb, #82aaff);
    --sheet-orange: light-dark(#f97316, #ffad69);
    --sheet-highlight: light-dark(#f1f5f9, #303845);
    background: var(--sheet-paper);
    color: var(--sheet-ink);
    font:
      12px/16px -apple-system,
      BlinkMacSystemFont,
      'Segoe UI',
      sans-serif;
    padding: 16px;
    min-width: 0;
    box-sizing: border-box;
  }
  #annotation-style-options h2 {
    font-size: 18px;
    line-height: 24px;
    font-weight: 600;
    margin: 0 0 4px;
  }
  #annotation-style-options .system + .system {
    margin-top: 24px;
  }
  #annotation-style-options .bar-numbers {
    display: grid;
    grid-template-columns: 1fr 1fr;
    color: var(--sheet-secondary);
    font-size: 11px;
    height: 16px;
  }
  #annotation-style-options .roll {
    height: 72px;
    position: relative;
    background-color: var(--sheet-roll);
    background-image:
      repeating-linear-gradient(to bottom, transparent 0 17px, var(--sheet-grid) 17px 18px),
      linear-gradient(
        to right,
        transparent calc(50% - 0.5px),
        var(--sheet-rule) calc(50% - 0.5px),
        var(--sheet-rule) calc(50% + 0.5px),
        transparent calc(50% + 0.5px)
      );
  }
  #annotation-style-options .note {
    position: absolute;
    height: 3px;
    border-radius: 2px;
    background: var(--sheet-blue);
    color: var(--sheet-blue);
  }
  #annotation-style-options .note.bass {
    background: var(--sheet-orange);
    color: var(--sheet-orange);
  }
  #annotation-style-options .note span {
    position: absolute;
    bottom: 4px;
    white-space: nowrap;
  }
  #annotation-style-options .common {
    margin-top: 4px;
  }
  #annotation-style-options .harmony {
    display: grid;
    grid-template-columns: 1fr 1fr;
  }
  #annotation-style-options .chord {
    font-weight: 700;
  }
  #annotation-style-options .timing {
    font-weight: 400;
    color: var(--sheet-secondary);
    white-space: nowrap;
  }
  #annotation-style-options .pedal {
    height: 8px;
    position: relative;
  }
  #annotation-style-options .pedal span {
    position: absolute;
    top: 3px;
    height: 3px;
    border-radius: 2px;
    background: var(--sheet-rule);
  }
  #annotation-style-options .comments {
    display: grid;
    gap: 4px;
    margin-top: 2px;
  }
  #annotation-style-options .annotation {
    display: flex;
    align-items: flex-start;
    gap: 4px;
    min-width: 0;
    color: var(--sheet-secondary);
  }
  #annotation-style-options .caption {
    max-width: 67%;
    flex: 0 1 auto;
    overflow-wrap: anywhere;
  }
  #annotation-style-options .start,
  #annotation-style-options .continuation {
    flex: 0 0 8px;
    color: var(--sheet-rule);
    text-align: center;
  }
  #annotation-style-options .tail {
    flex: 1 1 16px;
    min-width: 16px;
    height: 1px;
    background: var(--sheet-rule);
    margin-top: 8px;
  }
  #annotation-style-options .lead {
    flex: 0 0 10px;
    height: 1px;
    background: var(--sheet-rule);
    margin-top: 8px;
  }
  #annotation-style-options [data-design='connected'] .annotation {
    gap: 3px;
  }
  #annotation-style-options [data-design='connected'] .start {
    position: relative;
  }
  #annotation-style-options [data-design='connected'] .start::after {
    content: '';
    position: absolute;
    top: 8px;
    right: -3px;
    width: 6px;
    height: 1px;
    background: var(--sheet-rule);
  }
  #annotation-style-options [data-design='last'] .annotation {
    align-items: flex-end;
  }
  #annotation-style-options [data-design='last'] .start {
    align-self: flex-start;
  }
  #annotation-style-options [data-design='last'] .tail {
    margin-top: 0;
    margin-bottom: 7px;
  }
  #annotation-style-options [data-design='once'] .annotation.continued .caption {
    display: none;
  }
  #annotation-style-options [data-design='once'] .annotation.continued .tail {
    min-width: 0;
  }
  #annotation-style-options .sheet.highlight .annotation[data-group='melody'],
  #annotation-style-options
    .sheet:has(.annotation[data-group='melody']:hover)
    .annotation[data-group='melody'] {
    background: var(--sheet-highlight);
    color: var(--sheet-ink);
  }
  @media (max-width: 480px) {
    #annotation-style-options [data-variant] {
      min-height: 520px;
      padding: 10px;
    }
    #annotation-style-options .sheet {
      padding: 12px;
    }
    #annotation-style-options .caption {
      max-width: 74%;
    }
  }
</style>
<script>
  (() => {
    const root = document.getElementById('annotation-style-options');
    const longComment = 'Play gently. Bring out the moving melody while keeping the bass quiet.';
    const shortComment = 'Bring out the melody.';

    function marker(design, continuesBefore) {
      return `<span class="start">${continuesBefore ? '‹' : '•'}</span>${design === 'connected' ? '<span class="lead"></span>' : ''}`;
    }

    function annotation(design, text, continuesBefore, continuesAfter, group, width, left) {
      const label = continuesBefore && design === 'once' ? ` data-tooltip="${text}"` : '';
      return `<div class="annotation${continuesBefore ? ' continued' : ''}" data-group="${group}"${label} style="width:${width}%;margin-left:${left}%">${marker(design, continuesBefore)}<span class="caption">${text}</span><span class="tail"></span>${continuesAfter ? '<span class="continuation">›</span>' : ''}</div>`;
    }

    function system(design, text, second) {
      const firstBar = second ? 3 : 1;
      const notes = second
        ? '<div class="note" style="left:0;width:25%;top:51px"><span>G4</span></div><div class="note" style="left:25%;width:25%;top:33px"><span>B4</span></div><div class="note" style="left:50%;width:25%;top:15px"><span>D5</span></div><div class="note bass" style="left:0;width:100%;top:69px"><span>C3</span></div>'
        : '<div class="note" style="left:0;width:25%;top:51px"><span>C4</span></div><div class="note" style="left:25%;width:25%;top:33px"><span>E4</span></div><div class="note" style="left:50%;width:25%;top:15px"><span>G4</span></div><div class="note bass" style="left:0;width:100%;top:69px"><span>C3</span></div>';
      return `<div class="system"><div class="bar-numbers"><span>${firstBar}</span><span>${firstBar + 1}</span></div><div class="roll">${notes}</div><div class="common"><div class="harmony"><span class="chord">${second ? 'G7' : 'Cmaj7'}</span><span class="chord">${second ? 'C' : 'Fmaj7'}${second ? '' : '<span class="timing"> · 100 BPM</span>'}</span></div><div class="pedal"><span style="left:2px;width:calc(50% - 4px)"></span><span style="left:calc(50% + 2px);right:2px"></span></div></div><div class="comments">${annotation(design, text, second, !second, 'melody', second ? 82 : 100, 0)}${second ? '' : annotation(design, 'Hold the bass while the right hand moves.', false, false, 'bass', 70, 20)}</div></div>`;
    }

    for (const sheet of root.querySelectorAll('.sheet')) {
      const state = { longText: true, highlight: false };
      const design = sheet.dataset.design;
      const systems = sheet.querySelector('.systems');
      function render() {
        const text = state.longText ? longComment : shortComment;
        systems.innerHTML = system(design, text, false) + system(design, text, true);
        sheet.classList.toggle('highlight', state.highlight);
      }
      render();
      if (globalThis.Tweak) {
        const tweak = new Tweak({ container: sheet, onChange: render });
        tweak.addToggle(state, 'longText', { label: 'Long comment' });
        tweak.addToggle(state, 'highlight', { label: 'Highlight linked segments' });
      }
    }
  })();
</script>
